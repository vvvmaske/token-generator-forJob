services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: generator, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app -d generator"], interval: 2s, timeout: 3s, retries: 20 }
    volumes: ["pgdata:/var/lib/postgresql/data"]
  alpha:
    build: .
    command: ["uvicorn", "app.fake_provider:alpha_app", "--host", "0.0.0.0", "--port", "8101"]
    environment: { PROVIDER_NAME: alpha, DATABASE_URL: postgresql://app:app@db:5432/generator, WEBHOOK_URL: http://api:8000/webhooks/providers/alpha }
    depends_on: { db: { condition: service_healthy } }
  beta:
    build: .
    command: ["uvicorn", "app.fake_provider:beta_app", "--host", "0.0.0.0", "--port", "8102"]
    environment: { PROVIDER_NAME: beta, DATABASE_URL: postgresql://app:app@db:5432/generator, WEBHOOK_URL: http://api:8000/webhooks/providers/beta }
    depends_on: { db: { condition: service_healthy } }
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/generator
      ALPHA_URL: http://alpha:8101
      BETA_URL: http://beta:8102
      WEBHOOK_SECRET: dev-secret-change-me
      PROVIDER_TIMEOUT: "60"
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { pgdata: {} }
